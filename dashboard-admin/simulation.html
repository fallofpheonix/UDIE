<div class="simulation-workspace">
    <section class="sim-header card">
        <h3>Urban Disruption Simulation</h3>
        <p>Model the impact of hypothetical events on city stability.</p>
    </section>

    <div class="sim-controls">
        <div class="card control-card">
            <h4>Event Injection</h4>
            <select id="sim-event-type">
                <option>Major Flooding</option>
                <option>Infrastructure Failure</option>
                <option>Protest / Crowd Accumulation</option>
            </select>
            <button onclick="sim.inject()">Deploy Simulation</button>
        </div>

        <div class="card control-card">
            <h4>Propagation Analysis</h4>
            <div class="slider-group">
                <label>Intensity</label>
                <input type="range" min="0" max="10" value="5">
            </div>
            <div class="slider-group">
                <label>Duration (Hours)</label>
                <input type="range" min="1" max="24" value="4">
            </div>
        </div>
    </div>

    <section class="sim-results card">
        <h3>Forecasted Impact</h3>
        <div class="impact-grid">
            <div class="impact-metric">
                <span class="label">Route Reliability Drop</span>
                <span class="value high">-42%</span>
            </div>
            <div class="impact-metric">
                <span class="label">Risk Gradient Shift</span>
                <span class="value medium">+1.2</span>
            </div>
        </div>
    </section>
</div>
