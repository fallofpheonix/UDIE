<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UDIE Admin - Dashboard</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/base.css">
</head>

<body>
    <div class="app">
        <header class="topbar">
            <div class="logo">UDIE Admin</div>
            <div class="status-pill">System Header: Healthy</div>
        </header>

        <div class="layout">
            <nav class="sidebar">
                <a href="#dashboard" onclick="router.navigate('dashboard')">Dashboard</a>
                <a href="#map" onclick="router.navigate('map')">Map Intelligence</a>
                <a href="#routes" onclick="router.navigate('routes')">Routes</a>
                <a href="#analytics" onclick="router.navigate('analytics')">Analytics</a>
                <a href="#simulation" onclick="router.navigate('simulation')">Simulation</a>
                <a href="#health" onclick="router.navigate('health')">Diagnostics</a>
                <a href="#settings" onclick="router.navigate('settings')">Settings</a>
            </nav>

            <main class="content" id="main-content">
                <!-- Content loaded via router.js -->
                <div class="loader">Syncing command center...</div>
            </main>
        </div>
    </div>
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
