services:
  postgres-primary:
    build:
      context: ../engine-backend
      dockerfile: docker/Postgres.Dockerfile
    container_name: udie-postgres-primary
    restart: unless-stopped
    environment:
      POSTGRES_USER: udie
      POSTGRES_PASSWORD: udie
      POSTGRES_DB: udie
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U udie -d udie" ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./postgres/primary/init:/docker-entrypoint-initdb.d:ro

  postgres-replica:
    build:
      context: ../engine-backend
      dockerfile: docker/Postgres.Dockerfile
    container_name: udie-postgres-replica
    restart: unless-stopped
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      PRIMARY_HOST: postgres-primary
      PRIMARY_PORT: 5432
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replicator
    command: ["/bin/sh", "/replica/bootstrap.sh"]
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U udie -d udie" ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./postgres/replica/bootstrap.sh:/replica/bootstrap.sh:ro

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  udie-backend:
    build:
      context: ../engine-backend
      dockerfile: docker/Dockerfile
    container_name: udie-backend
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      API_PREFIX: /api/v1
      H3_RESOLUTION: 9
      DATABASE_URL: postgresql://udie:udie@postgres-primary:5432/udie
      REDIS_URL: redis://redis:6379
    ports:
      - "3002:3000"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health/live >/dev/null 2>&1" ]
      interval: 10s
      timeout: 3s
      retries: 10

  udie-spatial-py:
    build:
      context: ../udie_backend_py
      dockerfile: docker/Dockerfile
    container_name: udie-spatial-py
    environment:
      PORT: 8000
      API_PREFIX: /api/v1
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8002:8000"
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')\"" ]
      interval: 10s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus
    container_name: udie-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      udie-backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana
    container_name: udie-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  node-exporter:
    image: prom/node-exporter
    container_name: udie-node-exporter
    ports:
      - "9100:9100"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: udie-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://udie:udie@postgres-primary:5432/udie?sslmode=disable"
    ports:
      - "9187:9187"

  redis-exporter:
    image: oliver006/redis_exporter
    container_name: udie-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"

volumes:
  postgres_primary_data:
  postgres_replica_data:
  grafana-storage:
