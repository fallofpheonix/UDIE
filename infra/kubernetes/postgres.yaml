apiVersion: v1
kind: Service
metadata:
  name: postgres-primary
spec:
  selector:
    app: postgres-primary
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-replica
spec:
  selector:
    app: postgres-replica
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-primary-init
data:
  00-run-migrations.sh: |
    #!/bin/sh
    set -eu
    for migration in /migrations/*.sql; do
      [ -f "${migration}" ] || continue
      psql -v ON_ERROR_STOP=1 --username "${POSTGRES_USER}" --dbname "${POSTGRES_DB}" -f "${migration}"
    done
  01-init-replication.sql: |
    CREATE ROLE replicator WITH REPLICATION LOGIN PASSWORD 'replicator';
    ALTER SYSTEM SET wal_level = 'replica';
    ALTER SYSTEM SET max_wal_senders = '10';
    ALTER SYSTEM SET max_replication_slots = '10';
    ALTER SYSTEM SET hot_standby = 'on';
  02-pg-hba.sh: |
    #!/bin/sh
    set -eu
    echo "host replication replicator all scram-sha-256" >> "${PGDATA}/pg_hba.conf"
    echo "host all all all scram-sha-256" >> "${PGDATA}/pg_hba.conf"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-primary
spec:
  serviceName: postgres-primary
  replicas: 1
  selector:
    matchLabels:
      app: postgres-primary
  template:
    metadata:
      labels:
        app: postgres-primary
    spec:
      initContainers:
        - name: copy-migrations
          image: udie-postgres:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - cp -R /migrations/. /bootstrap-migrations
          volumeMounts:
            - name: migrations
              mountPath: /bootstrap-migrations
      containers:
        - name: postgres
          image: udie-postgres:latest
          imagePullPolicy: IfNotPresent
          command:
            - postgres
            - -c
            - wal_level=replica
            - -c
            - max_wal_senders=10
            - -c
            - max_replication_slots=10
            - -c
            - hot_standby=on
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: udie-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: udie-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: udie-secrets
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "udie", "-d", "udie"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "udie", "-d", "udie"]
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: init
          configMap:
            name: postgres-primary-init
            defaultMode: 0755
        - name: migrations
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-replica
spec:
  serviceName: postgres-replica
  replicas: 1
  selector:
    matchLabels:
      app: postgres-replica
  template:
    metadata:
      labels:
        app: postgres-replica
    spec:
      initContainers:
        - name: bootstrap-replica
          image: udie-postgres:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              if [ ! -s /var/lib/postgresql/data/pgdata/PG_VERSION ]; then
                rm -rf /var/lib/postgresql/data/pgdata/*
                export PGPASSWORD="${REPLICATION_PASSWORD}"
                until pg_isready -h postgres-primary -p 5432 -U "${REPLICATION_USER}"; do sleep 2; done
                pg_basebackup -h postgres-primary -p 5432 -U "${REPLICATION_USER}" -D /var/lib/postgresql/data/pgdata -Fp -R -Xs -P
              fi
          env:
            - name: REPLICATION_USER
              valueFrom:
                secretKeyRef:
                  name: udie-secrets
                  key: REPLICATION_USER
            - name: REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: udie-secrets
                  key: REPLICATION_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: udie-postgres:latest
          imagePullPolicy: IfNotPresent
          command: ["postgres", "-c", "hot_standby=on"]
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "udie", "-d", "udie"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "udie", "-d", "udie"]
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
