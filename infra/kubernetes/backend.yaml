apiVersion: v1
kind: Service
metadata:
  name: udie-backend
spec:
  selector:
    app: udie-backend
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: udie-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: udie-backend
  template:
    metadata:
      labels:
        app: udie-backend
    spec:
      containers:
        - name: udie-backend
          image: udie-backend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              value: postgresql://udie:udie@postgres-primary:5432/udie
            - name: REDIS_URL
              value: redis://redis:6379
            - name: NODE_ROLE
              value: ALL
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
