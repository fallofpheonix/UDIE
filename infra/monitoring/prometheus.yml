global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "udie-backend"
    static_configs:
      - targets: ["udie-backend:3000"]
    metrics_path: "/api/v1/metrics"

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
